name: 🚀 Release Production

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-secrets:
    name: 🔐 Validate Required Credentials
    runs-on: ubuntu-latest
    steps:
      - name: Check EAS Credentials
        run: |
          if [ -z "${{ secrets.EAS_USERNAME }}" ] || [ -z "${{ secrets.EAS_PASSWORD }}" ]; then
            echo "❌ ERROR: Missing required EAS credentials"
            echo ""
            echo "Required secrets not configured:"
            [ -z "${{ secrets.EAS_USERNAME }}" ] && echo "  - EAS_USERNAME"
            [ -z "${{ secrets.EAS_PASSWORD }}" ] && echo "  - EAS_PASSWORD"
            echo ""
            echo "To add secrets: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ EAS credentials validated"

      - name: Check iOS Credentials
        run: |
          if [ -z "${{ secrets.APPLE_ID }}" ] || [ -z "${{ secrets.APPLE_PASSWORD }}" ] || [ -z "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "❌ ERROR: Missing required Apple credentials"
            echo ""
            echo "Required secrets for iOS submission:"
            [ -z "${{ secrets.APPLE_ID }}" ] && echo "  - APPLE_ID"
            [ -z "${{ secrets.APPLE_PASSWORD }}" ] && echo "  - APPLE_PASSWORD"
            [ -z "${{ secrets.APPLE_TEAM_ID }}" ] && echo "  - APPLE_TEAM_ID"
            echo ""
            echo "To add secrets: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ Apple credentials validated"

  build-and-submit-ios:
    needs: validate-secrets
    name: 📱 iOS Production Build & Submit
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: 🔐 Setup EAS CLI
        run: |
          npm install -g eas-cli@latest
          eas login --non-interactive --username ${{ secrets.EAS_USERNAME }} --password ${{ secrets.EAS_PASSWORD }}

      - name: 🏗️ Build iOS
        run: |
          eas build -p ios --profile production --wait --non-interactive

      - name: 📤 Submit to App Store
        run: |
          eas submit -p ios --profile production --latest --non-interactive

  build-and-submit-android:
    name: 🤖 Android Production Build & Submit
    runs-on: ubuntu-latest
    needs: validate-secrets
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: 🔐 Setup EAS CLI
        run: |
          npm install -g eas-cli@latest
          eas login --non-interactive --username ${{ secrets.EAS_USERNAME }} --password ${{ secrets.EAS_PASSWORD }}

      - name: 🏗️ Build Android
        run: |
          eas build -p android --profile production --wait --non-interactive

      - name: 📤 Submit to Google Play
        run: |
          eas submit -p android --profile production --latest --non-interactive

  create-release:
    name: 📝 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-secrets, build-and-submit-ios, build-and-submit-android]
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 📝 Create Release Notes
        run: |
          TAG=${{ github.ref_name }}
          echo "## Release $TAG" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 📱 iOS" >> RELEASE_NOTES.md
          echo "- Submitted to App Store Connect" >> RELEASE_NOTES.md
          echo "- Build: Production" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 🤖 Android" >> RELEASE_NOTES.md
          echo "- Submitted to Google Play Store" >> RELEASE_NOTES.md
          echo "- Build: Production" >> RELEASE_NOTES.md

      - name: 🎉 Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

  notify-slack:
    name: 💬 Notify Slack
    runs-on: ubuntu-latest
    needs: [validate-secrets, build-and-submit-ios, build-and-submit-android]
    if: always()
    steps:
      - name: 📢 Send Slack notification
        if: vars.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "⚠️ SLACK_WEBHOOK_URL not configured. Skipping notification."
            exit 0
          fi

          if [ "${{ needs.build-and-submit-ios.result }}" = "success" ] && [ "${{ needs.build-and-submit-android.result }}" = "success" ]; then
            STATUS="✅ Success"
            COLOR="good"
          else
            STATUS="❌ Failed"
            COLOR="danger"
          fi

          curl -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"title\": \"CUT BAT AI Release ${{ github.ref_name }}\",
                \"text\": \"$STATUS\",
                \"fields\": [
                  {\"title\": \"iOS Build\", \"value\": \"${{ needs.build-and-submit-ios.result }}\", \"short\": true},
                  {\"title\": \"Android Build\", \"value\": \"${{ needs.build-and-submit-android.result }}\", \"short\": true}
                ]
              }]
            }"
