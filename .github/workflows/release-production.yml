name: 🚀 Release Production

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-submit-ios:
    name: 📱 iOS Production Build & Submit
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: 🔐 Setup EAS CLI
        run: |
          npm install -g eas-cli@latest
          eas login --non-interactive --username ${{ secrets.EAS_USERNAME }} --password ${{ secrets.EAS_PASSWORD }}

      - name: 🏗️ Build iOS
        run: |
          eas build -p ios --profile production --wait --non-interactive

      - name: 📤 Submit to App Store
        run: |
          eas submit -p ios --profile production --latest --non-interactive

  build-and-submit-android:
    name: 🤖 Android Production Build & Submit
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: 🔐 Setup EAS CLI
        run: |
          npm install -g eas-cli@latest
          eas login --non-interactive --username ${{ secrets.EAS_USERNAME }} --password ${{ secrets.EAS_PASSWORD }}

      - name: 🏗️ Build Android
        run: |
          eas build -p android --profile production --wait --non-interactive

      - name: 📤 Submit to Google Play
        run: |
          eas submit -p android --profile production --latest --non-interactive

  create-release:
    name: 📝 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-submit-ios, build-and-submit-android]
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 📝 Create Release Notes
        run: |
          TAG=${{ github.ref_name }}
          echo "## Release $TAG" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 📱 iOS" >> RELEASE_NOTES.md
          echo "- Submitted to App Store Connect" >> RELEASE_NOTES.md
          echo "- Build: Production" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### 🤖 Android" >> RELEASE_NOTES.md
          echo "- Submitted to Google Play Store" >> RELEASE_NOTES.md
          echo "- Build: Production" >> RELEASE_NOTES.md

      - name: 🎉 Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

  notify-slack:
    name: 💬 Notify Slack
    runs-on: ubuntu-latest
    needs: [build-and-submit-ios, build-and-submit-android]
    if: always()
    steps:
      - name: 📢 Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        run: |
          STATUS=${{ job.status == 'success' && '✅ Success' || '❌ Failed' }}
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{\"text\": \"$STATUS: CUT BAT AI ${{ github.ref_name }} production release\"}"
