name: 🔐 Validate Required Secrets

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'eas.json'
  workflow_dispatch:

jobs:
  validate:
    name: ✅ Check Required Secrets
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Check EAS Secrets
        run: |
          MISSING_SECRETS=()

          if [ -z "${{ secrets.EAS_USERNAME }}" ]; then
            MISSING_SECRETS+=("EAS_USERNAME")
          fi

          if [ -z "${{ secrets.EAS_PASSWORD }}" ]; then
            MISSING_SECRETS+=("EAS_PASSWORD")
          fi

          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "❌ Missing EAS Secrets:"
            printf '  - %s\n' "${MISSING_SECRETS[@]}"
            echo ""
            echo "To add secrets:"
            echo "1. Go to Settings → Secrets and variables → Actions"
            echo "2. Click 'New repository secret'"
            echo "3. Add each missing secret"
            exit 1
          fi

          echo "✅ EAS secrets configured"

      - name: 🍎 Check iOS Secrets (Optional)
        run: |
          if [ -z "${{ secrets.APPLE_ID }}" ]; then
            echo "⚠️ APPLE_ID not configured - iOS App Store submission will fail"
          else
            echo "✅ APPLE_ID configured"
          fi

          if [ -z "${{ secrets.APPLE_PASSWORD }}" ]; then
            echo "⚠️ APPLE_PASSWORD not configured - iOS App Store submission will fail"
          else
            echo "✅ APPLE_PASSWORD configured"
          fi

          if [ -z "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "⚠️ APPLE_TEAM_ID not configured - iOS App Store submission will fail"
          else
            echo "✅ APPLE_TEAM_ID configured"
          fi

      - name: 🤖 Check Android Secrets (Optional)
        run: |
          if [ -z "${{ secrets.ANDROID_SERVICE_ACCOUNT }}" ]; then
            echo "⚠️ ANDROID_SERVICE_ACCOUNT not configured - Android Play Store submission will fail"
          else
            echo "✅ ANDROID_SERVICE_ACCOUNT configured"
          fi

      - name: 📋 Validate eas.json
        run: |
          echo "🔍 Checking eas.json configuration..."

          REQUIRED_FIELDS=(
            "build.production"
            "submit.production.ios"
            "submit.production.android"
            "updates"
          )

          for field in "${REQUIRED_FIELDS[@]}"; do
            if grep -q "\"$field\"" eas.json; then
              echo "✅ $field found"
            else
              echo "❌ $field missing"
              exit 1
            fi
          done

          # Check for placeholder values that shouldn't be there
          if grep -q "REPLACE_WITH" eas.json; then
            echo ""
            echo "⚠️ Found placeholder values in eas.json:"
            grep "REPLACE_WITH" eas.json
            echo ""
            echo "These must be filled before production release!"
          else
            echo "✅ No placeholder values found"
          fi

      - name: 📝 Summary
        if: always()
        run: |
          echo "## 🔐 Secrets & Configuration Summary"
          echo ""
          echo "**Required for all releases:**"
          echo "- ✅ EAS_USERNAME"
          echo "- ✅ EAS_PASSWORD"
          echo ""
          echo "**Required for iOS submission:**"
          echo "- ${APPLE_ID:+✅} ${APPLE_ID:-⚠️} APPLE_ID"
          echo "- ${APPLE_PASSWORD:+✅} ${APPLE_PASSWORD:-⚠️} APPLE_PASSWORD"
          echo "- ${APPLE_TEAM_ID:+✅} ${APPLE_TEAM_ID:-⚠️} APPLE_TEAM_ID"
          echo ""
          echo "**Required for Android submission:**"
          echo "- ${ANDROID_SERVICE_ACCOUNT:+✅} ${ANDROID_SERVICE_ACCOUNT:-⚠️} ANDROID_SERVICE_ACCOUNT"
          echo ""
          echo "**Optional:**"
          echo "- ${SLACK_WEBHOOK_URL:+✅} ${SLACK_WEBHOOK_URL:-⚠️} SLACK_WEBHOOK_URL"
