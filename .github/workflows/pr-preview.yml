name: 🔄 PR Preview (EAS Update)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/pr-preview.yml'

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-eas-update:
    name: 📡 Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔐 Setup EAS CLI
        run: |
          npm install -g eas-cli@latest
          eas login --non-interactive --username ${{ secrets.EAS_USERNAME }} --password ${{ secrets.EAS_PASSWORD }}

      - name: 📡 Publish preview update
        run: |
          eas update \
            --branch pr-${{ github.event.pull_request.number }} \
            --message "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}" \
            --non-interactive

      - name: 💬 Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **EAS Update Published!**\n\nPreview this PR by:\n\n1. **Open Expo Go** on your device\n2. Navigate to "Published projects" or "Browse all projects"\n3. Search for `cut-bat-ai`\n4. Select branch: `pr-${{ github.event.pull_request.number }}`\n\n**Or test locally:**\n```bash\nnpm install -g eas-cli\neas login\neas update --branch pr-${{ github.event.pull_request.number }} --check\n```'
            })

      - name: 📊 Check update status
        run: |
          eas update --status --branch pr-${{ github.event.pull_request.number }}
